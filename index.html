<link rel="stylesheet" href="vendor/tabler/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--sidebar-w:180px;--accent:#4f8ef7;--accent-dim:#1a3a6e;--accent-dim2:#203d80;--bg:#0f1117;--bg2:#161b27;--bg3:#1e2535;--bg4:#252d40;--border:#2a3347;--text:#e8eaf0;--text2:#8892a4;--text3:#4a5568;--success:#3ecf8e;--warn:#f59e0b;--err:#ef4444;--violet:#a78bfa;--radius:8px;
  --tag-calc-bg:#1a3a6e;--tag-calc2-bg:#1a3a1a;--tag-alg-bg:#3a1a3a;--tag-geo-bg:#3a2a1a;--tag-gr-bg:#123a3a;--shadow:0 18px 50px rgba(0,0,0,.5);--grid:#1b2232;--axis:#3a4560}
:root[data-theme="light"]{--accent:#2f6fe0;--accent-dim:#dfe9fd;--accent-dim2:#cddcfb;--bg:#f3f5fa;--bg2:#ffffff;--bg3:#f0f3f9;--bg4:#e7ecf5;--border:#d5dceb;--text:#141a26;--text2:#5a6478;--text3:#97a1b5;--success:#14a06a;--warn:#c47a06;--err:#d73636;--violet:#7c5ce0;
  --tag-calc-bg:#dfe9fd;--tag-calc2-bg:#dcf5e9;--tag-alg-bg:#efe6fd;--tag-geo-bg:#fdf0dc;--tag-gr-bg:#d9f4f4;--shadow:0 18px 50px rgba(30,40,70,.18);--grid:#e6ebf4;--axis:#9aa6bd}
html,body{height:100%}
body{font-family:var(--font-sans,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;overflow:hidden;-webkit-tap-highlight-color:transparent}
.mono{font-family:var(--font-mono,ui-monospace,"SF Mono",Menlo,Consolas,monospace)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden;background:var(--bg)}
.sidebar{width:var(--sidebar-w);background:var(--bg2);border-right:0.5px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.sidebar-logo{padding:16px 14px 12px;font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.02em;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:9px}
.sidebar-logo img{width:28px;height:28px;border-radius:7px}
.sidebar-logo span{display:block;white-space:nowrap;font-size:10px;color:var(--text2);font-weight:400;margin-top:1px}
.nav{display:flex;flex-direction:column;padding-top:4px}
.nav-item{display:flex;align-items:center;gap:9px;padding:10px 14px;cursor:pointer;border-left:3px solid transparent;color:var(--text2);transition:all .15s;font-size:13px;background:none;border-top:0;border-right:0;border-bottom:0;font-family:inherit;text-align:left;width:100%}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--accent);border-left-color:var(--accent)}
.nav-item i{font-size:16px;width:18px;text-align:center}
.nav-item kbd{margin-left:auto;font-size:9px;color:var(--text3);font-family:inherit;opacity:0;transition:opacity .15s}
.nav-item:hover kbd{opacity:1}
.history-section{margin-top:auto;border-top:0.5px solid var(--border);padding:8px 0 6px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.history-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);padding:6px 14px 4px;display:flex;justify-content:space-between;align-items:center}
.history-label button{background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;padding:0 2px}
.history-label button:hover{color:var(--err)}
#history-list{overflow-y:auto;max-height:34vh}
.history-item{padding:6px 14px;cursor:pointer;color:var(--text2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:all .15s}
.history-item:hover{background:var(--bg3);color:var(--text)}
.history-empty{padding:4px 14px;font-size:11px;color:var(--text3)}
.history-item .hist-tag{font-size:9px;padding:1px 5px;border-radius:3px;margin-right:4px;font-weight:500}
.tag-calc{background:var(--tag-calc-bg);color:var(--accent)}.tag-calc2{background:var(--tag-calc2-bg);color:var(--success)}.tag-alg{background:var(--tag-alg-bg);color:var(--violet)}.tag-geo{background:var(--tag-geo-bg);color:var(--warn)}.tag-gr{background:var(--tag-gr-bg);color:#22c3c3}
.side-foot{display:flex;gap:4px;padding:8px 10px;border-top:0.5px solid var(--border)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.tab-bar{display:flex;align-items:center;padding:0 10px 0 16px;background:var(--bg2);border-bottom:0.5px solid var(--border);gap:4px;min-height:46px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;transition:all .15s;white-space:nowrap;background:none;border:none;font-family:inherit}
.tab:hover{background:var(--bg3);color:var(--text)}
.tab.active{background:var(--accent-dim);color:var(--accent)}
.tools{display:flex;gap:2px;align-items:center;flex-shrink:0}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;border:0.5px solid transparent;background:none;color:var(--text2);cursor:pointer;font-size:17px;transition:all .15s;position:relative}
.icon-btn:hover{background:var(--bg3);color:var(--text);border-color:var(--border)}
.icon-btn.on{color:var(--accent)}
.get-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:7px;border:0.5px solid var(--accent);background:var(--accent-dim);color:var(--accent);font-size:12px;font-weight:600;cursor:pointer;margin-left:4px;font-family:inherit;white-space:nowrap}
.get-btn:hover{background:var(--accent-dim2)}
.content{flex:1;overflow-y:auto;padding:16px;position:relative}
.content::-webkit-scrollbar,#history-list::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:4px}.content::-webkit-scrollbar-track{background:transparent}.content::-webkit-scrollbar-thumb,#history-list::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.content.flush{padding:0;overflow:hidden;display:flex}
.fade-in{animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.panel-title{font-size:15px;font-weight:500;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel-title i{color:var(--accent)}
.panel-title .sub{font-size:11px;color:var(--text3);font-weight:400;margin-left:auto}
.card{background:var(--bg3);border:0.5px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.card-title{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:10px;font-weight:500;display:flex;align-items:center;gap:6px}
.card-title .r{margin-left:auto;text-transform:none;letter-spacing:0}
.row{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;flex-wrap:wrap}
label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block}
input,select{background:var(--bg4);border:0.5px solid var(--border);border-radius:6px;color:var(--text);padding:7px 10px;font-size:13px;width:100%;outline:none;font-family:inherit;transition:border .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
input.bad{border-color:var(--err)}
select option{background:var(--bg4)}
.inp-group{flex:1;min-width:80px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;border:0.5px solid var(--border);background:var(--bg4);color:var(--text2);transition:all .15s;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--bg3);color:var(--text);border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent-dim2);color:var(--accent)}
.btn-sm{padding:4px 9px;font-size:11px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 9px;border-radius:20px;font-size:11px;background:var(--bg4);border:0.5px solid var(--border);color:var(--text2);cursor:pointer;font-family:var(--font-mono,ui-monospace,monospace);transition:all .15s}
.chip:hover{color:var(--accent);border-color:var(--accent)}
.result-box{background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;padding:12px 14px;font-family:var(--font-mono,ui-monospace,monospace);font-size:14px;color:var(--text);line-height:1.6;word-break:break-word;min-height:44px;white-space:pre-wrap;position:relative}
.result-box.error{border-color:var(--err);color:var(--err)}
.result-box.success{border-color:var(--success)}
.result-box.pop{animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.985)}60%{transform:scale(1.01)}100%{transform:none}}
.result-box .copy-mini{position:absolute;top:6px;right:6px;opacity:0;transition:opacity .15s}
.result-box:hover .copy-mini{opacity:1}
.steps-box{background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;padding:12px 14px;font-size:12px;color:var(--text2);line-height:1.8;display:none}
.steps-box.show{display:block}
.steps-box:empty{display:none}
.steps-box .step{padding:3px 0;display:flex;gap:8px}.steps-box .step-n{color:var(--accent);font-weight:500;min-width:18px}
.toggle-steps{font-size:11px;color:var(--accent);cursor:pointer;text-decoration:underline;background:none;border:none;padding:0;margin-top:6px;font-family:inherit}
.graph-canvas{width:100%;height:180px;border-radius:6px;display:block;background:var(--bg2);border:0.5px solid var(--border);touch-action:none}
.badge{font-size:10px;padding:2px 7px;border-radius:3px;font-weight:500}
.badge-info{background:var(--accent-dim);color:var(--accent)}
.disc-pos{color:var(--success)}.disc-zer{color:var(--warn)}.disc-neg{color:var(--err)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sep{height:0.5px;background:var(--border);margin:12px 0}
.muted{color:var(--text2);font-size:12px}
.hint{color:var(--text3);font-size:11px;margin-top:6px}
.hint code,.muted code{background:var(--bg4);padding:0 4px;border-radius:3px;font-size:11px}

/* ---------- scientific calculator ---------- */
.sci-wrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;max-width:980px}
.calc-display{background:var(--bg2);border:0.5px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;transition:border-color .2s}
.calc-display:focus-within{border-color:var(--accent)}
.calc-display.flash{animation:flash .35s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.calc-top{display:flex;gap:6px;align-items:center;padding:8px 10px 0}
.pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;border:0.5px solid var(--border);color:var(--text2);background:var(--bg3);cursor:pointer;font-family:inherit;letter-spacing:.04em}
.pill.on{color:var(--accent);border-color:var(--accent);background:var(--accent-dim)}
.pill.mem{cursor:default}
.calc-top .spacer{flex:1}
.calc-expr-in{background:transparent;border:none;box-shadow:none!important;font-family:var(--font-mono,ui-monospace,monospace);font-size:15px;color:var(--text2);padding:8px 12px 2px;border-radius:0}
.calc-expr-in:focus{color:var(--text)}
.calc-result-row{display:flex;align-items:center;gap:8px;padding:2px 10px 10px 12px}
.calc-result{flex:1;font-size:30px;font-family:var(--font-mono,ui-monospace,monospace);color:var(--text);text-align:right;word-break:break-all;line-height:1.25;min-height:38px;transition:color .15s}
.calc-result.preview{color:var(--text3);font-size:22px}
.calc-result.error{color:var(--err);font-size:15px}
.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.key{padding:10px 4px;text-align:center;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;background:var(--bg4);border:0.5px solid var(--border);color:var(--text);transition:background .12s,border-color .12s,transform .08s,color .12s;user-select:none;font-family:inherit;position:relative;overflow:hidden;touch-action:manipulation}
.key:hover{background:var(--bg3);border-color:var(--accent)}
.key:active,.key.pressed{transform:scale(.93);background:var(--accent-dim)}
.key-op{background:var(--bg3);color:var(--accent);font-size:16px}
.key-fn{background:var(--bg3);color:var(--violet);font-size:12px}
.key-mem{background:transparent;color:var(--text2);font-size:11px;padding:6px 4px}
.key-eq{background:var(--accent);color:#fff;border-color:var(--accent);font-size:18px}
.key-eq:hover{background:var(--accent);filter:brightness(1.1)}
.key-clr{color:var(--err)}
.key-2nd.on{background:var(--violet);color:#fff;border-color:var(--violet)}
.key .ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:ripple .45s ease-out;pointer-events:none}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
.hist-panel{display:flex;flex-direction:column;min-height:0;max-height:560px}
.hist-panel .card{display:flex;flex-direction:column;min-height:0;flex:1;margin:0}
.hist-list{overflow-y:auto;flex:1;margin:0 -6px}
.hist-row{padding:7px 8px;border-radius:7px;cursor:pointer;transition:background .12s;text-align:right}
.hist-row:hover{background:var(--bg4)}
.hist-row .he{font-size:11px;color:var(--text2);font-family:var(--font-mono,ui-monospace,monospace);word-break:break-all}
.hist-row .hr{font-size:15px;color:var(--text);font-family:var(--font-mono,ui-monospace,monospace);word-break:break-all}
.hist-row .hr:hover{color:var(--accent)}
.hist-empty{color:var(--text3);font-size:12px;text-align:center;padding:24px 6px}

/* ---------- grapher ---------- */
.gr{display:flex;flex:1;min-width:0;min-height:0}
.gr-side{width:290px;flex-shrink:0;border-right:0.5px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;min-height:0}
.gr-side .scroll{overflow-y:auto;padding:12px;flex:1}
.fn-row{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.fn-dot{width:20px;height:20px;border-radius:50%;flex-shrink:0;cursor:pointer;border:2px solid transparent;transition:opacity .15s;position:relative}
.fn-dot.off{opacity:.25}
.fn-row .lbl{font-family:var(--font-mono,ui-monospace,monospace);font-size:12px;color:var(--text2);flex-shrink:0}
.fn-row input{font-family:var(--font-mono,ui-monospace,monospace);font-size:13px;padding:6px 8px}
.fn-row .icon-btn{width:26px;height:26px;font-size:14px}
.gr-stage{flex:1;position:relative;min-width:0;min-height:0}
.gr-stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;outline:none}
.gr-stage canvas.dragging{cursor:grabbing}
.gr-ctrl{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
.gr-ctrl .icon-btn{background:var(--bg2);border-color:var(--border);box-shadow:0 2px 10px rgba(0,0,0,.18)}
.gr-tip{position:absolute;pointer-events:none;background:var(--bg2);border:0.5px solid var(--border);border-radius:7px;padding:5px 8px;font-size:11px;font-family:var(--font-mono,ui-monospace,monospace);color:var(--text);box-shadow:0 4px 18px rgba(0,0,0,.25);white-space:nowrap;display:none;z-index:2}
.gr-tip b{font-weight:600}
.gr-info{position:absolute;left:12px;bottom:10px;font-size:11px;color:var(--text3);font-family:var(--font-mono,ui-monospace,monospace);background:color-mix(in srgb,var(--bg) 70%,transparent);padding:2px 6px;border-radius:5px;pointer-events:none}
.pts-list{display:flex;flex-direction:column;gap:3px;font-family:var(--font-mono,ui-monospace,monospace);font-size:11px;color:var(--text2);max-height:150px;overflow:auto}
.pts-list div{cursor:pointer;padding:2px 4px;border-radius:4px}
.pts-list div:hover{background:var(--bg4);color:var(--text)}

/* ---------- converter ---------- */
.base-grid{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center}
.base-grid .bl{font-size:11px;color:var(--text3);font-weight:600;letter-spacing:.06em}
.base-grid .bv{font-family:var(--font-mono,ui-monospace,monospace);font-size:14px;word-break:break-all;background:var(--bg2);border:0.5px solid var(--border);border-radius:6px;padding:6px 10px;min-height:34px}
.bits{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin-top:10px}
.bit{font-family:var(--font-mono,ui-monospace,monospace);font-size:11px;text-align:center;padding:4px 0;border-radius:4px;background:var(--bg4);border:0.5px solid var(--border);cursor:pointer;color:var(--text3);user-select:none}
.bit.on{background:var(--accent-dim);color:var(--accent);border-color:var(--accent)}
.unit-table{width:100%;border-collapse:collapse;font-size:12px}
.unit-table td{padding:5px 8px;border-bottom:0.5px solid var(--border)}
.unit-table td:last-child{text-align:right;font-family:var(--font-mono,ui-monospace,monospace);color:var(--text)}
.unit-table tr{cursor:pointer}
.unit-table tr:hover td{background:var(--bg4)}
.conv-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.const-card{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;margin-bottom:6px;cursor:pointer;gap:10px;transition:border-color .15s}
.const-card:hover{border-color:var(--accent)}
.const-card .cv{font-family:var(--font-mono,ui-monospace,monospace);font-size:13px;color:var(--accent);text-align:right}
.const-card .cs{font-size:11px;color:var(--text3)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;background:rgba(5,8,14,.55);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:10vh 16px 16px}
.ov.show{display:flex;animation:fadeIn .15s ease}
.modal{background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;box-shadow:var(--shadow);width:100%;max-width:520px;max-height:80vh;overflow:auto;padding:18px}
.modal h3{font-size:16px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.modal h3 i{color:var(--accent)}
.modal h3 .x{margin-left:auto}
.dl-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.dl{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:10px;border:0.5px solid var(--border);background:var(--bg3);color:var(--text);text-decoration:none;cursor:pointer;font-family:inherit;text-align:left;font-size:13px;transition:border-color .15s}
.dl:hover{border-color:var(--accent)}
.dl i{font-size:22px;color:var(--accent)}
.dl small{color:var(--text2);font-size:11px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px;color:var(--text2)}
.keys div{display:flex;align-items:center;gap:4px}
.keys span{margin-left:auto;text-align:right}
kbd{font-family:inherit;font-size:11px;background:var(--bg4);border:0.5px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--text)}
.pal{max-width:560px;padding:0;overflow:hidden}
.pal input{border:none;border-bottom:0.5px solid var(--border);border-radius:0;padding:14px 16px;font-size:15px;background:transparent;box-shadow:none!important}
.pal-list{max-height:50vh;overflow:auto;padding:6px}
.pal-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2)}
.pal-item i{font-size:16px;width:18px;text-align:center}
.pal-item small{margin-left:auto;color:var(--text3);font-size:11px}
.pal-item.sel{background:var(--accent-dim);color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--bg2);border:0.5px solid var(--border);color:var(--text);padding:9px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px)}
.toast i{color:var(--success);font-size:16px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- responsive ---------- */
@media (max-width:1100px){.sci-wrap{grid-template-columns:1fr}.hist-panel{max-height:300px}}
@media (max-width:760px){
  .app{flex-direction:column-reverse}
  .sidebar{width:100%;flex-direction:row;border-right:none;border-top:0.5px solid var(--border);padding-bottom:env(safe-area-inset-bottom)}
  .sidebar-logo,.history-section,.side-foot{display:none}
  .nav{flex-direction:row;width:100%;padding:0}
  .nav-item{flex-direction:column;gap:2px;padding:7px 2px 6px;font-size:10px;border-left:none;border-top:2px solid transparent;align-items:center;text-align:center}
  .nav-item.active{border-top-color:var(--accent);border-left-color:transparent}
  .nav-item i{font-size:19px}
  .nav-item kbd{display:none}
  .tab-bar{padding:0 6px 0 8px;padding-top:env(safe-area-inset-top)}
  .get-btn span{display:none}.get-btn{padding:6px 8px;margin-left:2px}
  .tools .hide-sm{display:none}
  .panel-title .sub{display:none}
  .content{padding:12px}
  .gr{flex-direction:column}
  .gr-side{width:100%;border-right:none;border-bottom:0.5px solid var(--border);max-height:42%}
  .gr-stage{min-height:260px}
  .key{padding:12px 2px;font-size:15px}
  .key-fn{font-size:13px}
  .calc-result{font-size:28px}
  .grid3{grid-template-columns:1fr 1fr}
  .conv-row{grid-template-columns:1fr}
  .conv-row .btn{justify-self:center}
  .keys{grid-template-columns:1fr}
  .bits{grid-template-columns:repeat(8,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<h1 class="sr-only">Advanced Math Lab — Calculator, Graphing, Calculus, Algebra, Geometry and Converter modules</h1>
<div class="app">
<nav class="sidebar" aria-label="Modules">
  <div class="sidebar-logo"><img src="icons/icon-192.png" alt=""><div>∑ Math Lab<span>Advanced • Offline</span></div></div>
  <div class="nav">
    <button class="nav-item active" data-mod="calc" id="nav-calc"><i class="ti ti-calculator" aria-hidden="true"></i>Calculator<kbd>Alt 1</kbd></button>
    <button class="nav-item" data-mod="graph" id="nav-graph"><i class="ti ti-chart-dots" aria-hidden="true"></i>Graph<kbd>Alt 2</kbd></button>
    <button class="nav-item" data-mod="calc2" id="nav-calc2"><i class="ti ti-infinity" aria-hidden="true"></i>Calculus<kbd>Alt 3</kbd></button>
    <button class="nav-item" data-mod="alg" id="nav-alg"><i class="ti ti-variable" aria-hidden="true"></i>Algebra<kbd>Alt 4</kbd></button>
    <button class="nav-item" data-mod="geo" id="nav-geo"><i class="ti ti-shape" aria-hidden="true"></i>Geometry<kbd>Alt 5</kbd></button>
    <button class="nav-item" data-mod="conv" id="nav-conv"><i class="ti ti-transform" aria-hidden="true"></i>Convert<kbd>Alt 6</kbd></button>
  </div>
  <div class="history-section">
    <div class="history-label">Recent <button id="recent-clear" title="Clear recent" aria-label="Clear recent"><i class="ti ti-trash"></i></button></div>
    <div id="history-list"></div>
  </div>
  <div class="side-foot">
    <button class="icon-btn" id="help-btn2" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"><i class="ti ti-keyboard"></i></button>
    <button class="icon-btn" id="haptic-btn" title="Vibration feedback" aria-label="Vibration feedback"><i class="ti ti-device-mobile-vibration"></i></button>
  </div>
</nav>
<div class="main">
  <div class="tab-bar">
    <div class="tabs" id="tab-bar" role="tablist"></div>
    <div class="tools">
      <button class="icon-btn" id="pal-btn" title="Search tools (Ctrl+K)" aria-label="Search tools"><i class="ti ti-search"></i></button>
      <button class="icon-btn hide-sm" id="share-btn" title="Copy a link to this calculation" aria-label="Share link"><i class="ti ti-link"></i></button>
      <button class="icon-btn" id="sound-btn" title="Sounds (Alt+M)" aria-label="Toggle sounds"><i class="ti ti-volume"></i></button>
      <button class="icon-btn" id="theme-btn" title="Light / dark (Alt+D)" aria-label="Toggle theme"><i class="ti ti-sun"></i></button>
      <button class="icon-btn hide-sm" id="help-btn" title="Shortcuts & help (?)" aria-label="Help"><i class="ti ti-help"></i></button>
      <button class="get-btn" id="get-btn" title="Install Math Lab"><i class="ti ti-download"></i><span>Get the app</span></button>
    </div>
  </div>
  <div class="content" id="content-area"></div>
</div>
</div>

<div class="ov" id="ov" role="dialog" aria-modal="true"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"><i class="ti ti-check"></i><span></span></div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
